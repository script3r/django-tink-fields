name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            django: "5.2"
          - python: "3.11"
            django: "5.2"
          - python: "3.12"
            django: "5.2"
          - python: "3.12"
            django: "6.0"
          - python: "3.13"
            django: "6.0"
          - python: "3.14"
            django: "6.0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "Django~=${{ matrix.django }}.0"

      - name: Run library tests
        env:
          PYTHONWARNINGS: default
        run: python -m pytest

      - name: Run example-project integration tests
        env:
          PYTHONWARNINGS: default
        run: python -m pytest -c example_project/pytest.ini example_project/example_app/tests

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]" build twine pip-audit bandit

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: pyright --pythonpath "$(command -v python)"

      - name: Audit dependencies and source
        run: |
          pip-audit
          bandit -r tink_fields -x tink_fields/test -ll

      - name: Build and validate distributions
        run: |
          python -m build
          twine check --strict dist/*
