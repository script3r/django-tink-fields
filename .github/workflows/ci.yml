name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            django: "5.2"
          - python: "3.11"
            django: "5.2"
          - python: "3.12"
            django: "5.2"
          - python: "3.12"
            django: "6.0"
          - python: "3.12"
            django: "6.1"
          - python: "3.13"
            django: "5.2"
          - python: "3.13"
            django: "6.0"
          - python: "3.13"
            django: "6.1"
          - python: "3.14"
            django: "5.2"
          - python: "3.14"
            django: "6.0"
          - python: "3.14"
            django: "6.1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "Django~=${{ matrix.django }}.0"

      - name: Run library tests
        env:
          PYTHONWARNINGS: default
        run: python -m pytest

      - name: Run example-project integration tests
        env:
          PYTHONWARNINGS: default
        run: python -m pytest -c example_project/pytest.ini example_project/example_app/tests

  postgresql:
    name: PostgreSQL 17 / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        django: ["5.2", "6.0", "6.1"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tink_fields
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d tink_fields"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test environment
        run: python -m pip install -e ".[test]" "Django~=${{ matrix.django }}.0"

      - name: Run library tests against PostgreSQL
        env:
          PYTHONWARNINGS: default
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGPASSWORD: postgres
        run: python -m pytest --ds=tink_fields.test.settings.postgresql

  minimum-tink:
    name: Python 3.10 / Django 5.2 / Tink 1.13.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimum supported Tink
        run: python -m pip install -e ".[test]" "Django~=5.2.0" "tink==1.13.0"
      - name: Test minimum supported Tink
        env:
          PYTHONWARNINGS: default
        run: |
          python -m pytest
          python -m pytest -c example_project/pytest.ini example_project/example_app/tests

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]" build twine pip-audit bandit

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: pyright --pythonpath "$(command -v python)"

      - name: Audit dependencies and source
        run: |
          pip-audit
          bandit -r tink_fields -x tink_fields/test -ll

      - name: Build and validate distributions
        run: |
          python -m build
          twine check --strict dist/*
