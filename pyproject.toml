[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tink-fields"
dynamic = ["version"]
description = "Tink-based encrypted model fields for Django"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Isaac Elbaz", email = "script3r@gmail.com"},
]
keywords = ["django", "encryption", "google-tink", "model-fields"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
]
dependencies = [
    "Django>=5.2,<6.1",
    "tink>=1.13,<2",
]

[project.urls]
Homepage = "https://github.com/script3r/django-tink-fields/"
Repository = "https://github.com/script3r/django-tink-fields/"
Issues = "https://github.com/script3r/django-tink-fields/issues"
Changelog = "https://github.com/script3r/django-tink-fields/blob/main/CHANGELOG.md"
Security = "https://github.com/script3r/django-tink-fields/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "django-stubs>=5.2",
    "pyright>=1.1.400",
    "ruff>=0.12",
]
test = [
    "coverage>=7.6",
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-django>=4.9",
    "psycopg[binary]>=3.2",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tink_fields*"]
exclude = ["tink_fields.test*"]

[tool.setuptools.dynamic]
version = {attr = "tink_fields._version.__version__"}

[tool.coverage.run]
branch = true
source = ["tink_fields"]
omit = ["tink_fields/test/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pyright]
include = ["tink_fields"]
exclude = ["tink_fields/test"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
"tink_fields/test/*" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tink_fields.test.settings.sqlite"
django_find_project = false
pythonpath = ["."]
testpaths = ["tink_fields/test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=tink_fields",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
